services:
  db:
    image: postgres:16
    container_name: open_data_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  data_load:
    build:
      context: .
      dockerfile: data_load/Dockerfile
    container_name: open_data_load
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
      - ./reports:/app/reports
    networks:
      - app_network

  data_quality_analysis:
    build:
      context: .
      dockerfile: data_quality_analysis/Dockerfile
    container_name: open_data_quality
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports
    networks:
      - app_network

  data_research:
    build:
      context: .
      dockerfile: data_research/Dockerfile
    container_name: open_data_research
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports
    networks:
      - app_network

  visualization:
    build:
      context: .
      dockerfile: visualization/Dockerfile
    container_name: open_data_visualization
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./plots:/app/plots
    networks:
      - app_network

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: open_data_web
    env_file:
      - .env
    depends_on:
      - db
      - data_load
      - data_quality_analysis
      - data_research
      - visualization
    ports:
      - "8000:8000"
    volumes:
      - ./reports:/app/reports:ro
      - ./plots:/app/plots:ro
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
